<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | QuickCV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand text-primary fw-bold" href="index.html">QuickCV</a>
    </div>
  </nav>

  <main class="min-vh-100 d-flex align-items-center justify-content-center p-3">
    <section class="card border-0 shadow-sm rounded-4 w-100" style="max-width: 28rem;" aria-labelledby="signup-title">
        <div class="card-body p-4 p-sm-5">
          <div class="mb-4">
            <h1 id="signup-title" class="h3 mb-2">Create your account</h1>
            <p class="text-secondary mb-0">Start building your resume in minutes.</p>
          </div>

          <form id="signupForm" action="#" method="post">
            <div class="mb-3">
              <label for="fullName" class="form-label fw-semibold">Full name</label>
              <input type="text" class="form-control" id="fullName" name="FullName" placeholder="Your name" autocomplete="name" required minlength="2">
            </div>

            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Email address</label>
              <input type="email" class="form-control" id="email" name="Email" placeholder="you@example.com" autocomplete="email" required>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label fw-semibold">Password</label>
              <input type="password" class="form-control" id="password" name="Password" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8">
            </div>

            <div class="mb-3">
              <label for="confirmPassword" class="form-label fw-semibold">Confirm password</label>
              <input type="password" class="form-control" id="confirmPassword" name="ConfirmPassword" placeholder="Type it again" autocomplete="new-password" required minlength="8">
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="terms" name="AcceptTerms" required>
              <label class="form-check-label text-secondary" for="terms">I agree to the terms of use and privacy policy.</label>
            </div>

            <button type="submit" class="btn btn-primary w-100">Create account</button>
          </form>

          <p class="text-center text-secondary mt-4 mb-0 small">Already have an account? <a href="SignIn.html" class="fw-semibold text-decoration-none">Sign in</a></p>
        </div>
    </section>
  </main>
</body>
</html>
