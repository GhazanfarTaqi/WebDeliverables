<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | QuickCV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand text-primary fw-bold" href="index.html">QuickCV</a>
    </div>
  </nav>

  <main class="min-vh-100 d-flex align-items-center justify-content-center p-3">
    <section class="card border-0 shadow-sm rounded-4 w-100" style="max-width: 28rem;" aria-labelledby="signin-title">
      <div class="card-body p-4 p-sm-5">
        <div class="mb-4">
          <h1 id="signin-title" class="h3 mb-2">Welcome back</h1>
          <p class="text-secondary mb-0">Sign in to access your saved resumes.</p>
        </div>

        <form id="signinForm" action="#" method="post">
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email address</label>
            <input type="email" class="form-control" id="email" name="Email" placeholder="you@example.com" autocomplete="email" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" id="password" name="Password" autocomplete="current-password" required>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="rememberMe" name="RememberMe">
            <label class="form-check-label text-secondary" for="rememberMe">Keep me signed in</label>
          </div>

          <button type="submit" class="btn btn-primary w-100">Sign in</button>
        </form>

        <p class="text-center text-secondary mt-4 mb-0 small">New to QuickCV? <a href="SignUp.html" class="fw-semibold text-decoration-none">Create an account</a></p>
      </div>
    </section>
  </main>
</body>
</html>
